[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlab"
version = "0.1.0"
description = "Credit default modeling, calibration, Monte Carlo portfolio stress testing and hypothetical decision research on the UCI Default of Credit Card Clients dataset."
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Ranges are compatibility bounds. The exact versions this project was verified
# with are pinned in requirements-lock.txt, and each run records its environment
# in artifacts/metrics/run_manifest.json. Upper bounds guard against untested
# major-version API changes.
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=15",
  "duckdb>=1.0,<3",
  "ucimlrepo>=0.0.7",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.0,<4",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "streamlit>=1.35,<2",
  "plotly>=5.20,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "ipykernel>=6",
  "nbformat>=5.9",
  "nbconvert>=7",
]

[project.scripts]
creditlab = "creditlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF100"]
ignore = ["E501"]  # long lines in docstrings/strings are allowed; formatter-free project

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: trains models or runs larger simulations (deselect with -m 'not slow')",
  "needs_data: requires data/raw/uci_350_data.csv (run `creditlab fetch` first)",
  "needs_artifacts: requires a completed `creditlab all` run",
]
filterwarnings = [
  "ignore::DeprecationWarning:streamlit.*",
]
