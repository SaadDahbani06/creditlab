[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F6"
textColor = "#161616"
linkColor = "#C8102E"
borderColor = "#E7E7E7"
dataframeBorderColor = "#EDEDED"
dataframeHeaderBackgroundColor = "#FAFAFA"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
blueBackgroundColor = "#F6F6F6"
blueTextColor = "#262626"
chartCategoricalColors = ["#C8102E", "#2C6FB0"]

[theme.sidebar]
backgroundColor = "#FAFAFA"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
