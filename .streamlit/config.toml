[theme]
base = "light"
primaryColor = "#D7263D"
backgroundColor = "#F6F3F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B1F"
linkColor = "#B81D31"
borderColor = "#ECE4E4"
dataframeBorderColor = "#F0EAEA"
dataframeHeaderBackgroundColor = "#FBF7F7"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "0.9rem"
buttonRadius = "full"
showWidgetBorder = true
blueBackgroundColor = "#FDECEE"
blueTextColor = "#9E1B2C"
chartCategoricalColors =["#D7263D", "#3D6FB6", "#E58A3A", "#2A9D8F", "#9B5DB5"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F3F3"

[server]
headless = true

[browser]
gatherUsageStats = false
